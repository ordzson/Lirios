<header class="site-header" [class.site-header--catalog]="catalogMode()">
  <a class="brand" routerLink="/" aria-label="Lirios, inicio">
    <span>Lirios</span>
    <svg class="brand__petal" viewBox="0 0 48 48" aria-hidden="true">
      <path d="M20 42C8 34 8 18 27 5c1 16-1 29-7 37Z" />
      <path d="M23 42c5-13 13-18 23-17-3 12-12 18-23 17Z" />
    </svg>
  </a>

  <button
    #menuToggle
    class="menu-toggle"
    type="button"
    aria-controls="primary-nav"
    [attr.aria-expanded]="menuOpen()"
    (click)="toggleMenu()"
  >
    <span>{{ menuOpen() ? 'Cerrar' : 'Menú' }}</span>
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path class="menu-toggle__top" d="M4 9h16" />
      <path class="menu-toggle__bottom" d="M4 15h16" />
    </svg>
  </button>

  <nav
    id="primary-nav"
    class="primary-nav"
    [class.is-open]="menuOpen()"
    aria-label="Navegación principal"
  >
    <a routerLink="/catalogo" [queryParams]="{ categoria: 'arreglos' }" (click)="closeMenu()"
      >Arreglos</a
    >
    <a routerLink="/catalogo" [queryParams]="{ categoria: 'flores' }" (click)="closeMenu()"
      >Flores individuales</a
    >
    <a routerLink="/personalizados" (click)="closeMenu()">Personaliza</a>
    <a routerLink="/" fragment="seguimiento" (click)="closeMenu()">Seguir pedido</a>
  </nav>

  @if (catalogMode()) {
    <a class="cart-link" routerLink="/catalogo" aria-label="Carrito">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <path d="M8.5 11.5h15l1.6 16h-18.2l1.6-16Z" />
        <path d="M12 12V8.5a4 4 0 0 1 8 0V12" />
      </svg>
      <span class="cart-link__desktop">Carrito ({{ cart.itemCount() }})</span>
    </a>
  }
</header>
